# 示例期在 Windows 和 Mac（Apple 芯片）上从头做一遍：装环境 → 下载素材 → 自检 → build（口播 → 时间线 → 渲染 1080p → 混音 → 检查 → 打包）
# → 成片、手机版、检查报告当 artifact 传上来。一次大约 15–25 分钟（第一次要下载听写模型，约 1.6 GB，之后走缓存）。
# 素材全部是可以公开分发的（assets/manifest.json 登记了地址、授权和 sha256），仓库里没有任何音频、视频文件。
# 听写：两边都用 faster-whisper large-v3-turbo 在 CPU 上跑（GitHub 的 Mac 虚拟机没有 GPU，mlx 用不了；本机 Mac 照常用 mlx large-v3）。
name: 示例期

on:
  push:
    branches: [kit]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: 示例期 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      CHONGGU_ASR_BACKEND: faster
      CHONGGU_ASR_MODEL: large-v3-turbo
      CI_CACHE: ${{ github.workspace }}/.ci-cache
      CHONGGU_CACHE: ${{ github.workspace }}/.ci-cache/chonggu
      HF_HOME: ${{ github.workspace }}/.ci-cache/hf
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.ci-cache/puppeteer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      # Windows 的 ffmpeg：gyan.dev 的完整版（带 libx264、loudnorm、rubberband），钉版本和 sha256（GitHub Release 上的固定文件）
      FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-full_build.zip
      FFMPEG_SHA256: 759d0a9831c436a0eb331ad36f236c06cb04aaa0005da46571f0e9d3d9206f6b
      # Windows 的 rubberband 命令行：官方 zip（和 install_windows.ps1、doctor --install 用的是同一个）
      RUBBERBAND_URL: https://breakfastquay.com/files/releases/rubberband-4.0.0-gpl-executable-windows.zip
      RUBBERBAND_SHA256: f2d47fc64dbb42f6cc62edf7933ac4fa89d8f0ef8b9cf97b6afc263a7fe05644

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      # puppeteer 25 要 Node 22.12 以上（stage/package-lock.json 的 engines）
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stage/package-lock.json

      - name: 缓存：听写模型、渲染用的 Chrome、Windows 的 ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/hf
            .ci-cache/puppeteer
            .ci-cache/ffmpeg
          key: ci-${{ runner.os }}-${{ env.CHONGGU_ASR_MODEL }}-${{ hashFiles('stage/package-lock.json') }}-ffmpeg9.0.2

      - name: ffmpeg、rubberband（Mac：Homebrew）
        if: runner.os == 'macOS'
        run: brew install ffmpeg rubberband

      - name: ffmpeg、rubberband（Windows：钉了 sha256 的 zip）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'; $ProgressPreference = 'SilentlyContinue'
          function Get-Zip($url, $sha, $dest) {
            $zip = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileName($url))
            Invoke-WebRequest -Uri $url -OutFile $zip
            $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            if ($h -ne $sha) { throw "$url 的 sha256 不对：$h" }
            New-Item -ItemType Directory -Force $dest | Out-Null
            Expand-Archive $zip -DestinationPath $dest -Force
            Remove-Item $zip
          }
          $ff = Join-Path $env:CI_CACHE 'ffmpeg'
          $bin = Join-Path $ff 'ffmpeg-9.0.2-full_build\bin'
          if (-not (Test-Path (Join-Path $bin 'ffmpeg.exe'))) { Get-Zip $env:FFMPEG_URL $env:FFMPEG_SHA256 $ff }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          # rubberband 解到缓存的 bin/：chonggu.paths.tool 会在那里找（和 install_windows.ps1 一样）
          Get-Zip $env:RUBBERBAND_URL $env:RUBBERBAND_SHA256 (Join-Path $env:CHONGGU_CACHE 'bin')
          & (Join-Path $bin 'ffmpeg.exe') -hide_banner -version | Select-Object -First 1

      # 每一步只写一条命令：Windows 上默认的 pwsh 只看最后一条命令的退出码
      - name: Python 包（听写用 faster-whisper，两边一样）
        run: python -m pip install -r requirements-win.txt pytest

      - name: 装成 chonggu 命令（检查 pyproject.toml）
        run: python -m pip install --no-deps -e .

      - name: 渲染舞台的 npm 包（puppeteer）
        working-directory: stage
        run: npm ci --no-audit --no-fund

      - name: 渲染用的 Chrome for Testing
        working-directory: stage
        run: npx --yes puppeteer browsers install chrome

      - name: 下载示例期的素材和字体（照 assets/manifest.json，按 sha256 核对）
        run: python -m chonggu fetch-assets episodes/demo

      # 自检只当参考：GitHub 的机器内存小、磁盘可能不到 doctor 要的 10 GB，会报 ✗；真正的门槛在 build 里
      - name: 环境自检
        continue-on-error: true
        run: python -m chonggu doctor

      - name: build 示例期（口播 → 时间线 → 渲染 → 混音 → 检查 → 打包）
        timeout-minutes: 30
        run: python -m chonggu build episodes/demo

      # 上面每一步都开着 UTF-8 模式、在 ASCII 的文件夹里跑：中文 Windows（默认 GBK、文件夹名带中文）的路径没走到。
      # 这台机器的 ANSI 代码页是 1252（改成 936 要重启），这已经是最接近的了：解码 ffprobe 输出、中文路径都会走一遍。
      - name: 不开 UTF-8 模式、中文文件夹再查一遍（模拟中文 Windows）
        if: runner.os == 'Windows'
        env:
          PYTHONUTF8: '0'
          PYTHONIOENCODING: ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -Recurse episodes/demo episodes/示例期
          python -m chonggu script-check episodes/示例期
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m chonggu qa episodes/示例期 --no-video
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pytest -q tests/qa

      - name: 检查报告写进摘要
        if: always()
        shell: python
        run: |
          import os, pathlib
          q = sorted(pathlib.Path('episodes/demo/out/qa').glob('qa_*.txt'))
          body = q[-1].read_text(encoding='utf-8') if q else '（没有检查报告：build 在 qa 之前就停了，看上面 build 那一步的输出）'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(f"### 示例期 · {os.environ['RUNNER_OS']}\n\n```\n{body}\n```\n")

      - name: 传成片、手机版、检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-${{ runner.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            episodes/demo/out/*.mp4
            episodes/demo/out/qa/
            episodes/demo/out/parts/log_*.txt
            episodes/demo/out/cues.json
            episodes/demo/timeline.json
            episodes/demo/voice/flags.tsv
            episodes/demo/voice/check.json

      # 单元测试只当参考（不挡这个 job）：示例期已经从头跑通；这里看各模块的测试在这个系统上过不过
      - name: 单元测试（参考）
        if: always()
        continue-on-error: true
        run: python -m pytest -q tests
